spring:
  application:
    name: back

  datasource:
    url: jdbc:postgresql://db:5432/amazonlike
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  error:
    include-message: always