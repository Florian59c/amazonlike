spring:
  application:
    name: back

  datasource:
    url: jdbc:postgresql://db:5432/amazonlike
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

cookie:
  name: ${COOKIE_NAME}
  secure: ${COOKIE_SECURE}
  max-age: ${COOKIE_MAX_AGE}